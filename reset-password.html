<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ตั้งรหัสผ่านใหม่ — MangaCatalog</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
    <link rel="stylesheet" href="/assets/site.css">
    <script src="/assets/app.js"></script>
</head>
<body>
    <a class="skip" href="#main">ข้ามไปเนื้อหา</a>
    <header id="site-header"></header>

    <main id="main">
        <div class="narrow">
            <div class="panel stack">
                <div>
                    <h1>ตั้งรหัสผ่านใหม่</h1>
                    <p class="muted small">กรอกรหัสผ่านใหม่ที่ต้องการใช้สำหรับบัญชีนี้</p>
                </div>
                <form id="reset-form" class="stack" novalidate>
                    <div class="field">
                        <label for="password">รหัสผ่านใหม่</label>
                        <div class="pw">
                            <input class="input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                            <button type="button" id="pw-toggle" aria-label="แสดงรหัสผ่าน" aria-pressed="false"></button>
                        </div>
                        <span class="hint">อย่างน้อย 8 ตัวอักษร</span>
                    </div>
                    <div class="field">
                        <label for="password2">ยืนยันรหัสผ่านใหม่</label>
                        <input class="input" id="password2" name="password2" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
                    </div>
                    <p id="form-error" class="form-error" role="alert"></p>
                    <button class="btn btn-primary btn-block" id="submit" type="submit">ตั้งรหัสผ่านใหม่</button>
                </form>
                <div id="done" class="note hide" role="status"></div>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>
    <script src="/assets/reset-password.js"></script>
</body>
</html>
