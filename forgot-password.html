<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ลืมรหัสผ่าน — MangaCatalog</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@400;500&display=swap">
    <link rel="stylesheet" href="/assets/site.css">
    <script src="/assets/app.js"></script>
</head>
<body>
    <a class="skip" href="#main">ข้ามไปเนื้อหา</a>
    <header id="site-header"></header>

    <main id="main">
        <div class="narrow">
            <div class="panel stack">
                <div>
                    <h1>ลืมรหัสผ่าน</h1>
                    <p class="muted small">กรอกอีเมลที่ใช้สมัครไว้ เราจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้</p>
                </div>
                <form id="forgot-form" class="stack" novalidate>
                    <div class="field">
                        <label for="email">อีเมล</label>
                        <input class="input" id="email" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
                    </div>
                    <p id="form-error" class="form-error" role="alert"></p>
                    <button class="btn btn-primary btn-block" id="submit" type="submit">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
                </form>
                <div id="done" class="note hide" role="status"></div>
                <p class="small muted center"><a href="/login">กลับไปเข้าสู่ระบบ</a></p>
            </div>
        </div>
    </main>

    <footer id="site-footer"></footer>
    <script src="/assets/forgot-password.js"></script>
</body>
</html>
